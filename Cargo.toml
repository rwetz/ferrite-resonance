[package]
name = "ferrite-resonance"
version = "0.1.3"
description = "A Ferrite song visualizer: waveform, spectrum, stereo vectorscope and audio-reactive ASCII."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-resonance"
readme = "README.md"
keywords = ["gpui", "ferrite", "radio", "audio", "desktop"]
categories = ["gui", "multimedia::audio"]
edition = "2024"
rust-version = "1.88"

[dependencies]
futures = "0.3"
serde_json = "1"
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "4ddbb40bf34e219278784fdcb4e5d0e4e76f4cdc" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
cpal = "0.17"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "flac"] }
rustfft = "6.4"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
